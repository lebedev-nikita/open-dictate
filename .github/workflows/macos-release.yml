name: macOS release

on:
  push:
    tags: ["macos-v*"]

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate version
        run: |
          test "$GITHUB_REF_NAME" = "macos-v$(cat apps/macos/VERSION)"
      - name: Test
        run: |
          bash apps/macos/scripts/test-release-version.sh
          swift test --package-path apps/macos
      - name: Build universal app and installer
        run: apps/macos/scripts/package.sh
      - name: Publish macOS release
        run: |
          version="$(cat apps/macos/VERSION)"
          dmg="dist/macos/OpenDictate-macOS-${version}-universal.dmg"
          flags=()
          if [[ "$version" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" \
            --verify-tag --title "OpenDictate for macOS $version" \
            --notes-file apps/macos/RELEASE_NOTES.md --latest=false "${flags[@]}"

  homebrew:
    # Releases created with GITHUB_TOKEN do not trigger release-event workflows.
    needs: release
    if: ${{ !contains(github.ref_name, '-rc.') }}
    permissions:
      contents: read
    uses: ./.github/workflows/macos-homebrew.yml
    secrets:
      HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
