name: macOS release

on:
  push:
    tags: ["macos-v*"]

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GOOGLE_DRIVE_OAUTH_CLIENT_JSON: ${{ secrets.MACOS_GOOGLE_DRIVE_OAUTH_CLIENT_JSON }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate version
        run: |
          test "$GITHUB_REF_NAME" = "macos-v$(cat apps/macos/VERSION)"
      - name: Validate Google Drive client configuration
        run: python3 apps/macos/scripts/configure-google-drive.py --required
      - name: Test
        run: |
          bash apps/macos/scripts/test-release-version.sh
          python3 -m unittest discover -s apps/macos/scripts -p test_configure_google_drive.py
          swift test --package-path apps/macos
      - name: Build universal app and installer
        run: apps/macos/scripts/package.sh
      - name: Publish macOS release
        run: |
          version="$(cat apps/macos/VERSION)"
          dmg="dist/macos/OpenDictate-macOS-${version}-universal.dmg"
          flags=()
          if [[ "$version" == *-rc.* ]]; then flags+=(--draft --prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" \
            --verify-tag --title "macos $version" \
            --notes-file apps/macos/RELEASE_NOTES.md --latest=false "${flags[@]}"
